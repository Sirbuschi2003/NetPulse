<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Status</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=0.8.6">
</head>
<body class="status-page">
  <div class="status-hero">
    <div class="status-wrap">
      <div class="status-brand"><img src="favicon.svg" alt="" width="34" height="34"><div>
        <h1 id="st-title">Status</h1><p id="st-desc"></p></div></div>
      <div class="status-overall" id="st-overall">Lade …</div>
    </div>
  </div>
  <main class="status-wrap" id="st-items"></main>
  <p class="muted small status-foot"><span class="st-live" id="st-live"><span class="st-live-dot"></span>Live</span> · aktualisiert <span id="st-age">–</span>
    (Stand <span id="st-updated">–</span>) · bereitgestellt mit NetPulse</p>
  <script src="status.js?v=0.8.6"></script>
</body>
</html>
