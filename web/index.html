<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>NetPulse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=0.4.0">
</head>
<body>
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="favicon.svg" alt="" width="30" height="30">
        <span>Net<b>Pulse</b></span>
      </a>
      <nav id="nav">
        <p class="nav-label">Übersicht</p>
        <a href="#/dashboard"><svg class="i"><use href="icons.svg?v=0.4.0#i-layout-dashboard"/></svg>Dashboard</a>
        <a href="#/devices"><svg class="i"><use href="icons.svg?v=0.4.0#i-devices"/></svg>Geräte</a>
        <a href="#/alerts"><svg class="i"><use href="icons.svg?v=0.4.0#i-bell"/></svg>Alarme<span class="nav-badge" id="alert-badge" hidden></span></a>
        <a href="#/events"><svg class="i"><use href="icons.svg?v=0.4.0#i-list-details"/></svg>Ereignisse</a>
        <p class="nav-label admin-only">Verwaltung</p>
        <a href="#/networks" class="admin-only"><svg class="i"><use href="icons.svg?v=0.4.0#i-topology-star-3"/></svg>Netzwerke</a>
        <a href="#/credentials" class="admin-only"><svg class="i"><use href="icons.svg?v=0.4.0#i-key"/></svg>Zugangsdaten</a>
        <a href="#/channels" class="admin-only"><svg class="i"><use href="icons.svg?v=0.4.0#i-send"/></svg>Benachrichtigungen</a>
        <a href="#/users" class="admin-only"><svg class="i"><use href="icons.svg?v=0.4.0#i-users"/></svg>Benutzer</a>
        <a href="#/audit" class="admin-only"><svg class="i"><use href="icons.svg?v=0.4.0#i-shield-lock"/></svg>Audit-Log</a>
      </nav>
      <div class="scan-mini" id="scan-mini" hidden></div>
      <div class="sidebar-foot">
        <a href="#/account" class="user-chip" id="user-chip"><svg class="i"><use href="icons.svg?v=0.4.0#i-user"/></svg><span id="user-name"></span></a>
        <button class="icon-btn" id="theme-toggle" type="button" title="Hell/Dunkel umschalten"><svg class="i"><use href="icons.svg?v=0.4.0#i-moon"/></svg></button>
        <button class="icon-btn" id="logout" type="button" title="Abmelden"><svg class="i"><use href="icons.svg?v=0.4.0#i-logout"/></svg></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" type="button" title="Menü"><svg class="i"><use href="icons.svg?v=0.4.0#i-menu-2"/></svg></button>
        <h1 id="page-title">Dashboard</h1>
        <div class="search">
          <svg class="i"><use href="icons.svg?v=0.4.0#i-search"/></svg>
          <input id="global-search" type="search" placeholder="Gerät suchen: Name, IP, MAC, Hersteller …" aria-label="Gerät suchen">
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <div id="login-view"></div>
  <dialog id="modal"></dialog>
  <script src="app.js?v=0.4.0"></script>
  <script src="devices.js?v=0.4.0"></script>
  <script src="admin.js?v=0.4.0"></script>
</body>
</html>
