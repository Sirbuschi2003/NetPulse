<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>NetPulse</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NetPulse">
  <link rel="stylesheet" href="style.css?v=0.9.13">
</head>
<body>
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <img src="favicon.svg" alt="" width="30" height="30">
        <span>Net<b>Pulse</b></span>
      </a>
      <nav id="nav">
        <p class="nav-label">Übersicht</p>
        <a href="#/dashboard"><svg class="i"><use href="icons.svg?v=0.9.13#i-layout-dashboard"/></svg>Dashboard</a>
        <a href="#/devices"><svg class="i"><use href="icons.svg?v=0.9.13#i-devices"/></svg>Geräte</a>
        <a href="#/alerts"><svg class="i"><use href="icons.svg?v=0.9.13#i-bell"/></svg>Alarme<span class="nav-badge" id="alert-badge" hidden></span></a>
        <a href="#/checks"><svg class="i"><use href="icons.svg?v=0.9.13#i-world-www"/></svg>Dienste</a>
        <a href="#/map"><svg class="i"><use href="icons.svg?v=0.9.13#i-hierarchy-2"/></svg>Netzwerkkarte</a>
        <a href="#/energy"><svg class="i"><use href="icons.svg?v=0.9.13#i-bolt"/></svg>Energie</a>
        <a href="#/events"><svg class="i"><use href="icons.svg?v=0.9.13#i-list-details"/></svg>Ereignisse</a>
        <a href="https://github.com/Sirbuschi2003/NetPulse/blob/main/docs/HANDBUCH.md" target="_blank" rel="noopener noreferrer"><svg class="i"><use href="icons.svg?v=0.9.13#i-info-circle"/></svg>Handbuch</a>
        <p class="nav-label admin-only">Verwaltung</p>
        <a href="#/networks" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-topology-star-3"/></svg>Netzwerke</a>
        <a href="#/credentials" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-key"/></svg>Zugangsdaten</a>
        <a href="#/syslog" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-file-text"/></svg>Protokolle</a>
        <a href="#/statuspage" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-world"/></svg>Statusseite</a>
        <a href="#/maintenance" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-calendar-time"/></svg>Wartung</a>
        <a href="#/channels" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-send"/></svg>Benachrichtigungen</a>
        <a href="#/users" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-users"/></svg>Benutzer</a>
        <a href="#/audit" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-shield-lock"/></svg>Audit-Log</a>
        <a href="#/logs" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-file-text"/></svg>System-Log</a>
        <a href="#/backup" class="admin-only"><svg class="i"><use href="icons.svg?v=0.9.13#i-database"/></svg>Sicherung</a>
      </nav>
      <div class="scan-mini" id="scan-mini" hidden></div>
      <div class="sidebar-foot">
        <a href="#/account" class="user-chip" id="user-chip"><svg class="i"><use href="icons.svg?v=0.9.13#i-user"/></svg><span id="user-name"></span></a>
        <button class="icon-btn" id="theme-toggle" type="button" title="Hell/Dunkel umschalten"><svg class="i"><use href="icons.svg?v=0.9.13#i-moon"/></svg></button>
        <button class="icon-btn" id="logout" type="button" title="Abmelden"><svg class="i"><use href="icons.svg?v=0.9.13#i-logout"/></svg></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" type="button" title="Menü"><svg class="i"><use href="icons.svg?v=0.9.13#i-menu-2"/></svg></button>
        <h1 id="page-title">Dashboard</h1>
        <button type="button" class="ghost sm install-btn" data-install hidden>App installieren</button>
        <span class="live-dot" id="live-dot" title="Live-Verbindung">LIVE</span>
        <div class="search">
          <svg class="i"><use href="icons.svg?v=0.9.13#i-search"/></svg>
          <input id="global-search" type="search" placeholder="Gerät suchen: Name, IP, MAC, Hersteller …" aria-label="Gerät suchen">
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <div id="login-view"></div>
  <dialog id="modal"></dialog>
  <script src="app.js?v=0.9.13"></script>
  <script src="devices.js?v=0.9.13"></script>
  <script src="admin.js?v=0.9.13"></script>
  <script src="energy.js?v=0.9.13"></script>
</body>
</html>
