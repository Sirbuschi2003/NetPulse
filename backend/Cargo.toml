[package]
name = "netpulse"
version = "0.1.0"
edition = "2021"
description = "Agentenloses Netzwerk-Monitoring mit Weboberfläche"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
# Zeitzone für den Scan-Zeitplan („täglich um 03:00“)
chrono-tz = "0.10"
dns-lookup = "2"
# Entpacken der eingebetteten MIB-Namensliste
flate2 = "1"
futures = "0.3"
hex = "0.4"
md-5 = "0.10"
# Web Push (RFC 8291): Schlüsselableitung und Signatur für die NetPulse-App
hkdf = "0.13"
# Zwei-Faktor-Anmeldung (TOTP, RFC 6238)
hmac = "0.12"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# E-Mail-Versand (SMTP mit TLS über rustls/ring – kein OpenSSL nötig)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
# HTTP-Client für Push-Dienste (ntfy, Gotify, Telegram, Discord, Teams, Webhooks)
# TLS-Zertifikate prüfen (Dienst-Checks) – dieselbe rustls/ring-Basis wie reqwest
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
x509-parser = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
# SSH-Client für Linux-, NAS- und Windows-Abfragen (ring statt aws-lc: einfacher Cross-Build)
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
# SNMP v2c/v3 mit reiner Rust-Kryptografie
snmp2 = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros", "migrate"] }
surge-ping = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
