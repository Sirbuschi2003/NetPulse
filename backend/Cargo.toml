[package]
name = "netpulse"
version = "0.1.0"
edition = "2021"
description = "Agentenloses Netzwerk-Monitoring mit Weboberfläche"
publish = false

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dns-lookup = "2"
futures = "0.3"
hex = "0.4"
# E-Mail-Versand (SMTP mit TLS über rustls/ring – kein OpenSSL nötig)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
# HTTP-Client für Push-Dienste (ntfy, Gotify, Telegram, Discord, Teams, Webhooks)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# SSH-Client für Linux-, NAS- und Windows-Abfragen (ring statt aws-lc: einfacher Cross-Build)
russh = { version = "0.63", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# SNMP v2c/v3 mit reiner Rust-Kryptografie
snmp2 = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros", "migrate"] }
surge-ping = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
