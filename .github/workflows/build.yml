# Prüft den Code bei jeder Änderung und baut fertige Docker-Images für PC/NAS (amd64)
# und Raspberry Pi (arm64). Die Images landen in der GitHub Container Registry:
#   ghcr.io/sirbuschi2003/netpulse        – die Anwendung
#   ghcr.io/sirbuschi2003/netpulse-proxy  – Caddy mit fertiger HTTPS-Konfiguration

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Grundsätzlich nur Lesen – Schreibrechte für die Registry nur im Image-Job
permissions:
  contents: read

jobs:
  test:
    name: Tests & Lints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  images:
    name: Image ${{ matrix.image }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: netpulse
            dockerfile: Dockerfile
          - image: netpulse-proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sirbuschi2003/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
