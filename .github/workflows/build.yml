# Prüft den Code bei jeder Änderung und baut fertige Docker-Images für PC/NAS (amd64)
# und Raspberry Pi (arm64). Die Images landen in der GitHub Container Registry:
#   ghcr.io/sirbuschi2003/netpulse        – die Anwendung
#   ghcr.io/sirbuschi2003/netpulse-proxy  – Caddy mit fertiger HTTPS-Konfiguration

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Alle Actions sind auf feste Commits gepinnt (Schutz vor manipulierten Tags); Dependabot hält sie aktuell.
# Die Images werden mit Sigstore/cosign signiert (ohne eigenen Schlüssel, über die GitHub-Identität)
# und bekommen eine Herkunftsangabe (Provenance) und Stückliste (SBOM).

# Grundsätzlich nur Lesen – Schreibrechte für die Registry nur im Image-Job
permissions:
  contents: read

jobs:
  test:
    name: Tests & Lints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  images:
    name: Image ${{ matrix.image }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # für die schlüssellose Signatur (OIDC-Token von GitHub)
      id-token: write
    strategy:
      matrix:
        include:
          - image: netpulse
            dockerfile: Dockerfile
          - image: netpulse-proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/sirbuschi2003/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Image signieren
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/sirbuschi2003/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
