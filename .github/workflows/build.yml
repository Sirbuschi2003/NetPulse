# Prüft den Code bei jeder Änderung und baut fertige Docker-Images für PC/NAS (amd64)
# und Raspberry Pi (arm64). Die Images landen in der GitHub Container Registry:
#   ghcr.io/sirbuschi2003/netpulse        – die Anwendung
#   ghcr.io/sirbuschi2003/netpulse-proxy  – Caddy mit fertiger HTTPS-Konfiguration

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Alle Actions sind auf feste Commits gepinnt (Schutz vor manipulierten Tags); Dependabot hält sie aktuell.
# Die Images werden mit Sigstore/cosign signiert (ohne eigenen Schlüssel, über die GitHub-Identität)
# und bekommen eine Herkunftsangabe (Provenance) und Stückliste (SBOM).

# Grundsätzlich nur Lesen – Schreibrechte für die Registry nur im Image-Job
permissions:
  contents: read

jobs:
  test:
    name: Tests & Lints
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  images:
    name: Image ${{ matrix.image }}
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # für die schlüssellose Signatur (OIDC-Token von GitHub)
      id-token: write
    strategy:
      matrix:
        include:
          - image: netpulse
            dockerfile: Dockerfile
          - image: netpulse-proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/sirbuschi2003/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true
      - name: Image signieren
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/sirbuschi2003/${{ matrix.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
