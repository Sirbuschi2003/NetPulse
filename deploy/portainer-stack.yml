# NetPulse – Stack für Portainer (fertige Images, nichts wird kompiliert)
#
# Portainer → Stacks → Add stack → Repository
#   Repository URL:    https://github.com/Sirbuschi2003/NetPulse
#   Repository reference: refs/heads/main
#   Compose path:      deploy/portainer-stack.yml
# Umgebungsvariablen (unten im Formular):
#   DB_PASSWORD, SITE_ADDRESS, SCAN_NETWORKS, INITIAL_ADMIN_PASSWORD
# Details: siehe README, Abschnitt „Installation mit Portainer“.

services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: netpulse-db
    restart: unless-stopped
    network_mode: host
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${DB_PORT:-5433}
      - -c
      - timescaledb.telemetry_level=off
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Bitte DB_PASSWORD setzen}
      POSTGRES_DB: netpulse
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT:-5433} -U netpulse"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ghcr.io/sirbuschi2003/netpulse:${NETPULSE_VERSION:-latest}
    container_name: netpulse-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://netpulse:${DB_PASSWORD}@127.0.0.1:${DB_PORT:-5433}/netpulse
      LISTEN_ADDR: 127.0.0.1:${APP_PORT:-18080}
      SCAN_NETWORKS: ${SCAN_NETWORKS:-}
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DISCOVERY_INTERVAL_MIN: ${DISCOVERY_INTERVAL_MIN:-15}
      MONITOR_INTERVAL_SEC: ${MONITOR_INTERVAL_SEC:-60}
      RETENTION_METRICS_DAYS: ${RETENTION_METRICS_DAYS:-90}
      RETENTION_EVENTS_DAYS: ${RETENTION_EVENTS_DAYS:-180}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-365}
      INVENTORY_INTERVAL_MIN: ${INVENTORY_INTERVAL_MIN:-5}
      # Für Links in Benachrichtigungen (Standard: SITE_ADDRESS)
      PUBLIC_URL: ${PUBLIC_URL:-${SITE_ADDRESS:-}}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Enthält den Tresor-Schlüssel (secret.key) für gespeicherte Zugangsdaten – mitsichern!
      - app-data:/data
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    read_only: true
    tmpfs: [/tmp]

  proxy:
    image: ghcr.io/sirbuschi2003/netpulse-proxy:${NETPULSE_VERSION:-latest}
    container_name: netpulse-proxy
    restart: unless-stopped
    network_mode: host
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Bitte SITE_ADDRESS setzen, z. B. https://192.168.178.10:8443}
      UPSTREAM: 127.0.0.1:${APP_PORT:-18080}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
